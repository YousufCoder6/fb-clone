<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-body">

    <!-- Top Navbar -->
    <header class="topbar">
        <div class="topbar-left">
            <div class="logo"><i class="fa-brands fa-facebook"></i></div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search Facebook">
            </div>
        </div>
        <div class="topbar-center">
            <a href="#" class="nav-icon active"><i class="fa-solid fa-house"></i></a>
            <a href="#" class="nav-icon"><i class="fa-solid fa-user-group"></i></a>
            <a href="#" class="nav-icon"><i class="fa-solid fa-tv"></i></a>
            <a href="#" class="nav-icon"><i class="fa-solid fa-store"></i></a>
        </div>
        <div class="topbar-right">
            <div class="menu-icon"><i class="fa-solid fa-ellipsis-vertical"></i></div>
            <div class="menu-icon"><i class="fa-brands fa-facebook-messenger"></i></div>
            <div class="menu-icon"><i class="fa-solid fa-bell"></i></div>
            <a href="index.html" class="logout-btn" title="Log Out"><i class="fa-solid fa-right-from-bracket"></i></a>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <aside class="left-sidebar">
            <ul>
                <li><i class="fa-solid fa-user" style="color: #0866ff;"></i> Muhammad Yousuf</li>
                <li><i class="fa-solid fa-user-group" style="color: #0866ff;"></i> Friends</li>
                <li><i class="fa-solid fa-clock" style="color: #0866ff;"></i> Memories</li>
                <li><i class="fa-solid fa-bookmark" style="color: #242526;"></i> Saved</li>
                <li><i class="fa-solid fa-store" style="color: #0866ff;"></i> Marketplace</li>
            </ul>
        </aside>

        <main class="feed-area">
            <div class="create-post">
                <div class="post-input-top">
                    <img src="https://via.placeholder.com/40" alt="Profile">
                    <input type="text" placeholder="What's on your mind?">
                </div>
                <hr>
                <div class="post-options">
                    <div class="option"><i class="fa-solid fa-video" style="color: #f3425f;"></i> Live video</div>
                    <div class="option"><i class="fa-solid fa-image" style="color: #45bd62;"></i> Photo/video</div>
                </div>
            </div>

            <div class="post-card">
                <div class="post-header">
                    <img src="https://via.placeholder.com/40" alt="User">
                    <div class="post-user-info">
                        <h4>Saylani Mass IT Training</h4>
                        <span>Just now · <i class="fa-solid fa-globe"></i></span>
                    </div>
                </div>
                <div class="post-body">
                    <p>Modern Web Development assignment completed successfully!</p>
                </div>
            </div>
        </main>

        <aside class="right-sidebar">
            <h3>Contacts</h3>
            <ul>
                <li><img src="https://via.placeholder.com/35" alt=""> Muhammad Hasan Ashraf</li>
            </ul>
        </aside>
    </div>

</body>
</html>
