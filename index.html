<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Log In or Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <!-- Left Side: Facebook Branding -->
        <div class="auth-left">
            <h1 class="fb-logo-text">facebook</h1>
            <p>Connect with friends and the world around you on Facebook.</p>
        </div>

        <!-- Right Side: Login Box -->
        <div class="auth-right">
            <div class="auth-card">
                <form action="dashboard.html">
                    <input type="text" placeholder="Email or phone number" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit" class="btn-login">Log In</button>
                </form>
                <a href="#" class="forgot-pass">Forgotten password?</a>
                <hr>
                <div class="create-account-container">
                    <a href="signup.html" class="btn-create">Create new account</a>
                </div>
            </div>
            <p class="auth-footer-text"><b>Create a Page</b> for a celebrity, brand or business.</p>
        </div>
    </div>

</body>
</html>
