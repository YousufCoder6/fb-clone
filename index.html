<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - log in or sign up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
    <div class="left-section">
            <h1 class="fb-logo">facebook</h1>
            <p class="fb-tagline">Connect with friends and the world around you on Facebook.</p>
        </div>

        <div class="right-section">
            <div class="login-card">
                <form>
                    <input type="text" placeholder="Email address or phone number" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit" class="login-btn">Log In</button>
                </form>
                <a href="#" class="forgot-link">Forgotten password?</a>
                <hr class="divider">
                <button class="create-btn">Create new account</button>
            </div>
        </div>
    </div>
</body>
</html>
